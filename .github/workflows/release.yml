name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New semantic version (for example, 2.3.2)
        required: true

permissions:
  contents: write

jobs:
  update-build-and-release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH without a prefix."
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Git tag $VERSION already exists."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install "poetry>=1.8,<3"

      - name: Set version, install, test, and build
        run: |
          poetry version "$VERSION"
          poetry install --no-interaction
          poetry run pytest
          poetry build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ vars.DOCKER_IMAGE_NAME }}:${{ env.VERSION }}
            ${{ vars.DOCKER_IMAGE_NAME }}:latest

      - name: Commit and tag the version
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pyproject.toml
          git commit -m "chore: release $VERSION"
          git tag "$VERSION"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "$VERSION"

      - name: Create GitHub release and upload Python artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "Release $VERSION" \
            --generate-notes \
            --verify-tag
